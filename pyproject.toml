[project]
name = "hyo2.qax"
version = "3.2.5rc4"
description = "A package to perform quality assurance on ocean mapping data."
readme = "README.md"
license = "LGPL-3.0-only"
requires-python = ">=3.10"
keywords = ["hydrography", "ocean", "mapping", "survey", "data", "quality"]
authors = [
    { name = "Giuseppe Masetti (UNH,CCOM)", email = "gmasetti@ccom.unh.edu" },
    { name = "Tyanne Faulkes (NOAA,OCS)", email = "tyanne.faulkes@noaa.gov" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "ausseabed-qajson",
    "ausseabed-findergc >=0.1.3",
    "ausseabed-ggoutlier >=0.1.0",
    "ausseabed-mbesgc >=0.1.0",
    "ausseabed-mbespc",
    "hyo2-mate",
    "appdirs",
    "GDAL",
    "pandas",
    "PySide2",
    "qtawesome >=1.4",
    "xlsxwriter",
]

[project.optional-dependencies]
QCTools = ["hyo2.qc"]
Mate = ["hyo2.mate"]

[project.urls]
Repository = "https://github.com/ausseabed/qax"
Homepage = "https://github.com/ausseabed/qax"

[project.gui-scripts]
qax = "hyo2.qax.app.gui:gui"

[build-system]
requires = ["hatchling >=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyo2"]
artifacts = [
    "hyo2/qax/app/media/docs/**"
]